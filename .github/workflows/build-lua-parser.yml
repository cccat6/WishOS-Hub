name: Build pinned Lua compiler
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Emscripten
        shell: bash
        run: |
          git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.74
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.74
      - name: Build stock Lua 5.4.8 compile-only module
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash scripts/build-lua-parser.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lua-5.4.8-parser
          path: build/lua-parser/*
