name: Build packages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.0', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run check:cloud
      - run: npm run cloud:bundle
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-latest, platform: win32, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.0', architecture: '${{ matrix.arch }}', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: wishos-hub-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/*.sha256

  guidance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.0' }
      - run: node scripts/package-guidance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wishos-guidance
          path: |
            build/guidance/*.zip
            build/guidance/*.sha256
            build/guidance/guidance-publication.json
