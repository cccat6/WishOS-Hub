name: Publish verified artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build run ID; packages are never rebuilt here
        required: true
      tag:
        description: Existing preview tag for the exact source commit
        required: true
      release_id:
        description: Numeric preview release ID; remains stable while draft
        required: true
      replace_existing:
        description: Explicitly replace an existing preview with the selected artifact set
        type: boolean
        default: false
concurrency:
  group: wishos-release-${{ inputs.tag }}
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      REPLACE_EXISTING: ${{ inputs.replace_existing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.0' }
      - name: Pin successful build and artifact IDs
        id: source
        run: node scripts/publish-release.mjs prepare
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_ids }}
          path: release-assets
          merge-multiple: true
      - name: Publish one verified generation
        run: node scripts/publish-release.mjs publish release-assets
