name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.0', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: npm test
      - run: npm run check:cloud
      - run: npm run cloud:bundle
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux, arch: x64}
          - {os: macos-15-intel, platform: darwin, arch: x64}
          - {os: macos-15, platform: darwin, arch: arm64}
          - {os: windows-latest, platform: win32, arch: x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.0', architecture: '${{ matrix.arch }}', cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: wishos-hub-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/*.sha256
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: release-assets, merge-multiple: true}
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --prerelease --title "WishOS Hub $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          find release-assets -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
